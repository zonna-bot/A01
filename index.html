let selectedStyle = null;

        function createStyleButtons() {
            const grid = document.getElementById('styleGrid');
            styles.forEach((style) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = style.name;
                btn.addEventListener('click', () => {
                    if (btn.classList.contains('selected')) {
                        btn.classList.remove('selected');
                        selectedStyle = null;
                        document.getElementById('styleSelected').textContent = '';
                    } else {
                        document.querySelectorAll('#styleGrid .opt-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedStyle = style;
                        document.getElementById('styleSelected').textContent = `已選：${style.name}`;
                    }
                });
                grid.appendChild(btn);
            });
        }

        function createCostumeButtons() {
            const categories = [
                { id: 'royal', data: costumes.royal, displayId: 'costumeRoyalSelected' },
                { id: 'fairy', data: costumes.fairy, displayId: 'costumeFairySelected' },
                { id: 'jiangnan', data: costumes.jiangnan, displayId: 'costumeJiangnanSelected' },
                { id: 'myth', data: costumes.myth, displayId: 'costumeMythSelected' }
            ];

            categories.forEach(cat => {
                const gridId = cat.id === 'royal' ? 'costumeGridRoyal' : cat.id === 'fairy' ? 'costumeGridFairy' : cat.id === 'jiangnan' ? 'costumeGridJiangnan' : 'costumeGridMyth';
                const gridEl = document.getElementById(gridId);
                
                cat.data.forEach(costume => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = costume.name;
                    btn.addEventListener('click', () => {
                        if (btn.classList.contains('selected')) {
                            btn.classList.remove('selected');
                            selectedCostume = null;
                            document.getElementById(cat.displayId).textContent = '';
                        } else {
                            document.querySelectorAll(`#${gridId} .opt-btn`).forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            selectedCostume = costume;
                            document.getElementById(cat.displayId).textContent = `已選：${costume.name}`;

                    gridEl.appendChild(btn);
                });
            });

        function createDetailsCheckboxes() {
            const container = document.getElementById('detailsGroup');
            details.forEach((detail, index) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = detail.name;
                btn.addEventListener('click', () => {
                    if (btn.classList.contains('selected')) {
                        btn.classList.remove('selected');
                        selectedDetails.delete(detail);
                    } else {
                        btn.classList.add('selected');
                        selectedDetails.add(detail);
                    }
                });
                container.appendChild(btn);
            });
        }

        function generatePrompt() {
            if (!selectedStyle) {
                alert('請先選擇圖片風格');
                return;
            }

            let prompt = `${intros[currentGender]}

風格：
${selectedStyle.prompt}

`;

            if (selectedCostume) {
                prompt += `服裝：
${selectedCostume.desc}

`;
            }

            if (selectedScene) {
                prompt += `場景：
${selectedScene.desc}

`;
            }

            if (selectedLighting) {
                prompt += `光影：
${selectedLighting.prompt}

`;
            }

            if (selectedDetails.size > 0) {
                prompt += `細節：\n`;
                selectedDetails.forEach(detail => {
                    prompt += `${detail.prompt}、`;
                });
                prompt = prompt.slice(0, -1) + '\n\n';
            }

            prompt += `高品質、電影級構圖、8K、高解析度、細緻布料紋理、真實光影。`;

            document.getElementById('promptOutput').textContent = prompt;
        }

        // 生成和複製功能
        document.getElementById('generateBtn').addEventListener('click', generatePrompt);

        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = document.getElementById('promptOutput').textContent;
            if (text.includes('請先選擇') || text.includes('按「生成」')) {
                alert('請先生成提示詞');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            });
        });

        // 切換女生 / 男生
        function setGender(g) {
            currentGender = g;
            styles = g === 'male' ? styles_m : styles_f;
            costumes = g === 'male' ? costumes_m : costumes_f;
            scenes = g === 'male' ? scenes_m : scenes_f;
            details = g === 'male' ? details_m : details_f;

            selectedStyle = null;
            selectedCostume = null;
            selectedLighting = null;
            selectedScene = null;
            selectedDetails = new Set();

            document.querySelectorAll('.button-row').forEach(el => { el.innerHTML = ''; });
            document.querySelectorAll('.selected-display').forEach(el => { el.textContent = ''; });
            document.getElementById('promptOutput').textContent = '請先選擇左邊的風格與配置，然後按「生成」按鈕';
            document.getElementById('copyFeedback').style.display = 'none';

            document.querySelectorAll('.gender-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.gender === g);
            });

            createStyleButtons();
            createCostumeButtons();
            createSceneButtons();
            createLightingButtons();
            createDetailsCheckboxes();

            const left = document.querySelector('.left-panel');
            if (left) left.scrollTop = 0;
        }

        document.querySelectorAll('.gender-btn').forEach(b => {
            b.addEventListener('click', () => setGender(b.dataset.gender));
        });

        // 初始化（預設女生版）
        setGender('female');
